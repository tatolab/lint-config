# The clippy configuration every Tatolab Rust workspace carries at least. `check_lint_table.py` holds a
# workspace's own `clippy.toml` to it: each disallowed macro here is disallowed there too.

disallowed-macros = [
    { path = "std::println", reason = "Use tracing::info! instead" },
    { path = "std::eprintln", reason = "Use tracing::warn! / tracing::error! instead" },
    { path = "std::print", reason = "Use tracing::info! instead" },
    { path = "std::eprint", reason = "Use tracing::warn! / tracing::error! instead" },
    { path = "std::dbg", reason = "Use tracing::debug! instead" },
]
